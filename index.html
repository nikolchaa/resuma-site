<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved or system theme before first paint (no light flash
         for dark-mode visitors). Keep in sync with ThemeProvider's storage
         key; if this script changes, update its hash in netlify.toml. -->
    <script>(function(){var t;try{t=localStorage.getItem("vite-ui-theme")}catch(e){}var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.add(d?"dark":"light")})()</script>

    <title>Resuma – Free, Open-Source AI Resume Builder for Desktop</title>
    <meta
      name="description"
      content="Build professional, ATS-friendly resumes in a free, open-source desktop app. AI is optional: run it locally, bring your own model, or turn it off."

    <link rel="canonical" href="https://resuma.download/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="author" content="Nikola Ranđelović" />

      name="keywords"
      content="resume builder, AI resume builder, free resume builder, open-source resume app, ATS resume, resume templates, local AI, offline resume builder, resume builder without AI, llama.cpp, GGUF, Hugging Face, Ollama, LM Studio, Resuma"
    />

    <link
      rel="preload"
